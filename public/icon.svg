<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1B1538" />
      <stop offset="60%" stop-color="#0A0B1A" />
      <stop offset="100%" stop-color="#04040A" />
    </radialGradient>

    <!-- Outer Crest Neon Glow -->
    <linearGradient id="crestNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#7928CA" />
      <stop offset="70%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="metalShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B4B" />
      <stop offset="45%" stop-color="#130F2E" />
      <stop offset="100%" stop-color="#0B081F" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>

    <!-- Cyan Energy Gradient -->
    <linearGradient id="cyanEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#crestNeon)" stroke-width="4" opacity="0.4" />

  <!-- Background Cyber Circuit Lines -->
  <g opacity="0.15" stroke="#00F5FF" stroke-width="2">
    <path d="M 64 128 L 128 128 L 160 160" fill="none" />
    <path d="M 448 128 L 384 128 L 352 160" fill="none" />
    <path d="M 64 384 L 140 384 L 180 344" fill="none" />
    <path d="M 448 384 L 372 384 L 332 344" fill="none" />
    <circle cx="160" cy="160" r="4" fill="#00F5FF" />
    <circle cx="352" cy="160" r="4" fill="#00F5FF" />
    <circle cx="180" cy="344" r="4" fill="#00F5FF" />
    <circle cx="332" cy="344" r="4" fill="#00F5FF" />
  </g>

  <!-- Cyber Wings Behind Shield -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M 160 140 L 70 190 L 110 240 L 150 220 L 90 280 L 145 285 L 120 340 L 180 300 Z" 
          fill="url(#cyanEnergy)" opacity="0.85" />
    <!-- Right Wing -->
    <path d="M 352 140 L 442 190 L 402 240 L 362 220 L 422 280 L 367 285 L 392 340 L 332 300 Z" 
          fill="url(#crestNeon)" opacity="0.85" />
  </g>

  <!-- Main Shield Outer Border with Neon Edge -->
  <path d="M 256 60 L 390 120 L 370 300 L 256 420 L 142 300 L 122 120 Z" 
        fill="url(#crestNeon)" filter="url(#glow)" />

  <!-- Main Shield Inner Core -->
  <path d="M 256 74 L 376 128 L 358 290 L 256 398 L 154 290 L 136 128 Z" 
        fill="url(#metalShield)" stroke="#00F5FF" stroke-width="2" />

  <!-- Tactical Shield Facets -->
  <path d="M 256 74 L 256 398 L 154 290 L 136 128 Z" fill="#000000" opacity="0.3" />
  <path d="M 256 74 L 376 128 L 256 220 Z" fill="#FFFFFF" opacity="0.07" />

  <!-- Golden Battle Swords / Cross Lightning -->
  <g filter="url(#glow)">
    <!-- Central Lightning Blade -->
    <path d="M 256 100 L 280 200 L 250 205 L 274 310 L 226 215 L 256 210 Z" 
          fill="url(#goldAccent)" />
  </g>

  <!-- Futuristic Gamer Headset / Visor Icon Elements -->
  <g fill="none" stroke="url(#cyanEnergy)" stroke-width="5" stroke-linecap="round">
    <path d="M 200 180 A 60 60 0 0 1 312 180" />
    <rect x="188" y="176" width="14" height="28" rx="6" fill="#00F5FF" />
    <rect x="310" y="176" width="14" height="28" rx="6" fill="#00F5FF" />
  </g>

  <!-- SMART BATTLE Text Plate Ribbon -->
  <g transform="translate(0, 40)">
    <!-- Ribbon Base Shape -->
    <path d="M 80 370 L 110 335 L 402 335 L 432 370 L 402 405 L 110 405 Z" 
          fill="#060814" stroke="url(#crestNeon)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Inner Ribbon Accent -->
    <path d="M 115 342 L 397 342 L 415 370 L 397 398 L 115 398 L 97 370 Z" 
          fill="#110E2E" />

    <!-- Text: SMART -->
    <text x="256" y="365" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="9" 
          text-anchor="middle" 
          fill="#00F5FF">SMART</text>

    <!-- Text: BATTLE -->
    <text x="256" y="394" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="28" 
          letter-spacing="10" 
          text-anchor="middle" 
          fill="#FFFFFF">BATTLE</text>
  </g>

  <!-- Top Crown Star Sparkle -->
  <polygon points="256,40 262,54 276,56 264,66 268,80 256,71 244,80 248,66 236,56 250,54" 
           fill="url(#goldAccent)" filter="url(#glow)" />
</svg>
